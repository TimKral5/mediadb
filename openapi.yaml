openapi: 3.0.4
info:
  title: MediaDB
  description: TODO (description)
  version: v0.1.0-alpha
  contact:
    name: Tim Kral
    url: https://github.com/timkral5/mediadb
    email: mail@timkral.com
  license:
    name: None
    url: https://example.com
tags:
  - name: Documentation
  - name: Authentication
  - name: Movies
paths:
  /docs:
    get:
      operationId: GetApiDocsHtml
      summary: Get the API documentation in HTML format
      tags:
        - Documentation
      security: []
      responses:
        200:
          description: Return documentation
  /auth/jwt:
    post:
      operationId: GenerateToken
      summary: Generate a JWT token from credentials
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        201:
          description: Token created
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/JwtToken'
        400:
          description: Invalid request body
        401:
          description: Invalid credentials
        500:
          description: Validation failed (error)
  /movies:
    post:
      operationId: CreateMovie
      summary: Create a movie
      tags:
        - Movies
      security:
        - jwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Movie'
      responses:
        201:
          description: Token created
          content:
            'application/json':
              schema:
                type: string
        400:
          description: Invalid request body
        401:
          description: Invalid token / No token provided
        403:
          description: Missing permissions
        500:
          description: Operation failed (error)
  /movies/{id}:
    get:
      operationId: GetMovie
      summary: Get a single movie from ID
      tags:
        - Movies
      security:
        - jwt: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Movie found
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/Movie'
        400:
          description: Invalid ID
        401:
          description: Invalid token / No token provided
        403:
          description: Missing permissions
        500:
          description: Operation failed (error)
    put:
      operationId: UpdateMovie
      summary: Update a movie record
      tags:
        - Movies
      security:
        - jwt: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Movie'
      responses:
        200:
          description: Success
        400:
          description: Invalid ID
        401:
          description: Invalid token / No token provided
        403:
          description: Missing permissions
        500:
          description: Operation failed (error)
    delete:
      operationId: DeleteMovie
      summary: Delete a movie record
      tags:
        - Movies
      security:
        - jwt: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Success
        400:
          description: Invalid ID
        401:
          description: Invalid token / No token provided
        403:
          description: Missing permissions
        500:
          description: Operation failed (error)
security:
  - jwt: []
components:
  securitySchemes:
    jwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Credentials:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
    Movie:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        release_date:
          type: string
    JwtToken:
      type: object
      properties:
        token:
          type: string
